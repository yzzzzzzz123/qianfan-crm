<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人听记关联 · 千帆 CRM</title><link rel="stylesheet" href="./personal-minutes.css"><script type="module" src="./personal-minutes.js"></script></head><body><main><p class="brand">千帆 CRM · 授权关联</p><h1>关联个人钉钉听记</h1><p>CRM 登录账号与保存听记的个人账号可以不同。听记只关联到当前核验的 CRM 成员。</p><p id="identity"></p><section id="status" role="status">正在核验当前登录与个人授权…</section><section id="preview" hidden><h2>已授权的听记来源</h2><p id="account"></p><ul id="notes"></ul></section><section id="handoff" hidden><p>个人授权已完成。请使用对应 CRM 成员或有切换权限的开发者账号登录，核对听记归属后确认关联。</p><button id="login" type="button">使用 CRM 钉钉身份登录</button></section><form id="confirmation" hidden><label><input id="accepted" type="checkbox" required><span id="accepted-text">我确认上述听记属于我使用的个人账号，并同意关联到我的 CRM 成员。</span></label><button id="confirm" type="submit" disabled>确认关联并读取已有听记</button></form><p class="error" id="error" role="alert"></p><p><a id="back" href="./#minutes">返回钉钉听记</a></p><button class="secondary" id="refresh" type="button">重新核验状态</button></main></body></html>
